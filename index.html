<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assembl-Easy · Emulatore 8086</title>
  </head>
  <body>
    <div id="app">
      <nav class="topnav">
        <a class="brand" href="#/emulatore">Assembl<b>Easy</b> <small>8086</small></a>
        <a data-route="emulatore" href="#/emulatore">Emulatore</a>
        <a data-route="esempi" href="#/esempi">Esempi</a>
        <a data-route="wiki" href="#/wiki">Wiki istruzioni</a>
        <a data-route="esercizi" href="#/esercizi">Esercizi</a>
        <a data-route="correzione" href="#/correzione">Correzione</a>
        <span id="status" class="status">—</span>
      </nav>

      <div id="view-emu" class="view">
        <header class="toolbar">
          <div class="tb-group">
            <select id="examples" title="Carica un esempio"></select>
            <button id="btn-open" title="Apri un file .asm dal computer">Apri</button>
            <button id="btn-save" title="Scarica il codice come .asm">Salva</button>
          </div>
          <div class="tb-group">
            <button id="btn-compile" class="primary" title="Assembla il programma (F9)">Compila</button>
          </div>
          <div class="tb-group">
            <button id="btn-run" class="go" title="Esegue fino alla fine o a un breakpoint (F5)">▶ Run</button>
            <button id="btn-step" title="Esegue una sola istruzione (F8)">⏭ Single step</button>
            <button id="btn-back" title="Annulla l'ultima istruzione (Shift+F8)">⏮ Step back</button>
            <button id="btn-stop" title="Interrompe l'esecuzione">⏹ Stop</button>
            <button id="btn-reset" title="Riporta il programma all'inizio">⟲ Reset</button>
          </div>
          <label class="tb-speed">Velocità
            <select id="speed" title="Velocità di Run">
              <option value="0">Lenta</option>
              <option value="1">Media</option>
              <option value="2">Veloce</option>
              <option value="3">Molto veloce</option>
              <option value="4" selected>Istantanea</option>
            </select>
          </label>
          <div class="tb-group layout-menu">
            <button id="btn-layout" title="Mostra, nascondi e riposiziona i pannelli">⊞ Pannelli ▾</button>
            <div id="layout-pop" class="layout-pop" hidden></div>
          </div>
        </header>

        <main id="dock" class="dockview-theme-assembl"></main>

        <!-- contenuto dei pannelli: viene spostato nel gestore di finestre -->
        <div id="pane-store" hidden>
          <section id="pane-editor" class="dock-pane">
            <div class="pane-bar legend">
              <i class="lg lg-cur"></i>prossima istruzione
              <i class="lg lg-last"></i>ultima eseguita
              <i class="lg lg-bp"></i>breakpoint (clic sul numero di riga)
            </div>
            <div id="editor-host"></div>
            <div id="messages" class="messages"></div>
          </section>

          <section id="pane-regs" class="dock-pane scroll">
            <div id="regs" class="regs"></div>
          </section>

          <section id="pane-log" class="dock-pane">
            <div id="last-step" class="last-step"></div>
            <div id="log" class="log"></div>
          </section>

          <section id="pane-screen" class="dock-pane">
            <div class="pane-bar">
              <span id="input-hint" class="hint"></span>
              <span class="spacer"></span>
              <span class="seg" title="Dimensione del testo">
                <button id="scr-minus" aria-label="Riduci testo">A−</button><button id="scr-plus" aria-label="Ingrandisci testo">A+</button>
              </span>
            </div>
            <pre id="console" class="console" tabindex="0"></pre>
          </section>

          <section id="pane-vars" class="dock-pane">
            <div class="pane-bar">
              <span class="muted small">Valori correnti delle variabili del programma</span>
              <span class="spacer"></span>
              <span id="vars-fmt" class="seg">
                <button data-fmt="dec" class="on">Dec</button><button data-fmt="hex">Hex</button>
              </span>
            </div>
            <div class="scroll"><div id="vars" class="vars"></div></div>
          </section>

          <section id="pane-mem" class="dock-pane">
            <div class="mem-controls">
              <label>Segmento
                <select id="mem-seg">
                  <option value="data" selected>Dati del programma</option>
                  <option value="ds">DS</option><option value="es">ES</option>
                  <option value="ss">SS</option><option value="cs">CS</option>
                </select>
              </label>
              <label>Offset
                <input id="mem-off" value="0000" maxlength="4" spellcheck="false" />
              </label>
            </div>
            <div class="scroll"><div id="mem" class="mem"></div></div>
          </section>

          <section id="pane-stack" class="dock-pane scroll">
            <div id="stack" class="stackview"></div>
          </section>
        </div>
      </div>

      <div id="view-page" class="view page" hidden></div>
    </div>
    <input id="file-input" type="file" accept=".asm,.txt" hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
